name: Build Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/freedailyjobalert.keystore

      - name: Build Release AAB
        run: |
          gradle bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/freedailyjobalert.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename AAB
        run: cp app/build/outputs/bundle/release/app-release.aab FreeDailyJobAlerts-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: FreeDailyJobAlerts-release-aab
          path: FreeDailyJobAlerts-release.aab
          compression-level: 0
          retention-days: 90
